[tool.poetry]
name = "industrialstats"
version = "0.1.0"
description = "Industrial statistics and design of experiments for Python"
authors = ["Diogo Ribeiro <diogo.debastos.ribeiro@gmail.com>"]
maintainers = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "industrialstats", from = "src" }]
homepage = "https://github.com/DiogoRibeiro7/industrialstats"
repository = "https://github.com/DiogoRibeiro7/industrialstats"
keywords = [
    "design of experiments",
    "industrial statistics",
    "DOE",
    "ANOVA",
    "factorial design",
    "response surface methodology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
numpy = "^2.3"
pandas = "^2.3"
scipy = "^1.16"
matplotlib = "^3.10"
seaborn = "^0.13"
statsmodels = "^0.14"
scikit-learn = ">=1.5,<1.9"
openpyxl = "^3.1"
plotly = "^6.3"
DataExcept = "^1.3.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
hypothesis = "^6.99"
black = "^25.9"
isort = "^7.0"
flake8 = "^7.0"
mypy = "^1.9"
pre-commit = "^4.3"

[tool.poetry.scripts]
industrialstats = "industrialstats.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501", "F401", "E402", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
pretty = true
ignore_errors = true
