[tool.poetry]
name = "industrialstats"
version = "0.1.0"
description = "Industrial statistics and design of experiments for Python"
authors = ["Diogo Ribeiro <diogo.debastos.ribeiro@gmail.com>"]
maintainers = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "industrialstats", from = "src" }]
# poetry-core does not read MANIFEST.in, so sdist extras are declared here.
# Files inside the package directory (py.typed included) ship automatically.
include = [{ path = "CHANGELOG.md", format = "sdist" }]
homepage = "https://github.com/DiogoRibeiro7/industrialstats"
repository = "https://github.com/DiogoRibeiro7/industrialstats"
documentation = "https://diogoribeiro7.github.io/industrialstats/"
keywords = [
    "design of experiments",
    "industrial statistics",
    "DOE",
    "ANOVA",
    "factorial design",
    "response surface methodology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/DiogoRibeiro7/industrialstats/issues"
"Changelog" = "https://github.com/DiogoRibeiro7/industrialstats/blob/main/CHANGELOG.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
numpy = "^2.3"
pandas = "^2.3"
scipy = "^1.16"
matplotlib = "^3.10"
seaborn = "^0.13"
statsmodels = "^0.14"
scikit-learn = ">=1.5,<1.9"
openpyxl = "^3.1"
plotly = "^6.3"
DataExcept = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10"  # 9.0.3 fixes GHSA-6w46-j5rx-g56g (tmpdir handling)
pytest-cov = "^7.0"
hypothesis = "^6.99"
ruff = "^0.14"
mypy = "^1.9"
pre-commit = "^4.3"
pandas-stubs = "^2.3"
types-openpyxl = "^3.1"
types-PyYAML = "^6.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocstrings = { version = "^0.30", extras = ["python"] }

[tool.poetry.scripts]
industrialstats = "industrialstats.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0.3"
testpaths = ["tests"]
# Make the src layout importable without requiring an editable install, so a
# bare `pytest` works on a fresh clone.
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
    # Timing-based checks are excluded by default so an ordinary run stays fast
    # and cannot fail on a loaded machine. Run them with `pytest -m benchmark`,
    # which overrides this selection.
    "-m",
    "not benchmark",
]
markers = [
    "benchmark: performance regression checks; excluded from the default run",
    "slow: tests that take a noticeable amount of wall-clock time",
]
filterwarnings = [
    "error",
    # statsmodels emits these from its own internals on small designs.
    "ignore::DeprecationWarning:statsmodels.*",
    "ignore::FutureWarning:statsmodels.*",
    "ignore:.*is_categorical_dtype.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["industrialstats"]
branch = true
parallel = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.paths]
# Collapse editable-install, wheel-install and src-layout paths onto one root
# so coverage combines correctly across the CI matrix.
source = ["src/industrialstats", "*/site-packages/industrialstats"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# Linting and formatting (ruff replaces black, isort and flake8)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["examples/notebooks"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes: undefined names, unused imports and variables
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear: likely bugs and design problems
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "NPY", # numpy-specific rules
    "PD",  # pandas-vet
    "N",   # pep8-naming
    "T20", # flake8-print: no stray prints in library code
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",    # line length is enforced by the formatter
    "PD011",   # `.values` is intentional against numpy interop
    "RET504",  # named result variables aid readability in statistical code
    "SIM108",  # ternaries are not always clearer than if/else here
    "PD101",   # `nunique() == 1` states "is balanced" clearly on tiny series,
               # and the suggested rewrite changes NaN handling
]

# Mathematical notation is not a typo: alpha is the standard symbol for the
# significance level, and en dashes and multiplication signs appear in design
# notation such as "2x3 factorial" in plot labels.
allowed-confusables = ["α", "–", "×"]

[tool.ruff.lint.per-file-ignores]
# Statistical code follows mathematical notation, where capitalised names such
# as X, XtX and SS_A are the conventional and clearest spelling.
"src/industrialstats/**" = ["N802", "N803", "N806"]
"tests/**" = [
    "N802",
    "N803",
    "N806",
    "B008",  # pytest fixtures legitimately call in argument defaults
]
# The CLI and the reporting scripts exist to write to stdout.
"src/industrialstats/cli.py" = ["T201"]
"scripts/**" = ["T201"]
# Examples are runnable narratives: they print, and they use the same
# mathematical notation as the library.
"examples/**" = ["T201", "T203", "N802", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["industrialstats"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pathlib.Path"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------

[tool.mypy]
# numpy >= 2.3 ships stubs written with PEP 695 `type` statements, which mypy
# refuses to parse when targeting 3.11, so type checking runs against 3.12.
# The 3.11 floor is still enforced: ruff targets py311 and the test matrix
# runs the suite on 3.11.
python_version = "3.12"
files = ["src/industrialstats"]
ignore_missing_imports = true
show_error_codes = true
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# Type-checking debt ratchet.
#
# These modules are numerically dense and still carry pre-existing type errors
# (mostly numpy/pandas stub friction, plus some genuine Optional handling).
# They are checked but not enforced, so the rest of the package stays clean and
# this list can only shrink. Do not add modules here without a good reason; see
# CONTRIBUTING.md for the burn-down policy.
[[tool.mypy.overrides]]
module = [
    "industrialstats.designs.response_surface",
    "industrialstats.designs.optimal",
    "industrialstats.designs.factorial",
    "industrialstats.analysis.power_analysis",
    "industrialstats.analysis.model_fitting",
    "industrialstats.utils.validation",
]
ignore_errors = true
