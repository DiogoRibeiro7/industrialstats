[tool.poetry]
name = "industrialstats"
version = "0.1.0"
description = "Industrial Statistics for Python - Professional-grade statistical tools for manufacturing excellence"
authors = ["Diogo Ribeiro <diogo.debastos.ribeiro@gmail.com>"]
maintainers = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "industrialstats", from = "src" }]
repository = "https://github.com/DiogoRibeiro7/industrialstats"

[tool.poetry.dependencies]
python = ">=3.10"
numpy = "^2.3"
pandas = "^2.3"
scipy = "^1.16"
matplotlib = "^3.10"
seaborn = "^0.13"
statsmodels = "^0.14"
scikit-learn = "^1.5"
openpyxl = "^3.1"
plotly = "^5.22"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
hypothesis = "^6.99"
black = "^24.4"
isort = "^5.13"
flake8 = "^7.0"
mypy = "^1.9"
pre-commit = "^3.7"

[tool.poetry.scripts]
industrialstats = "industrialstats.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501", "F401", "E402", "F841"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
show_error_codes = true
pretty = true
ignore_errors = true
