name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly disclosed advisories are caught without a code change.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Resolve the shipped dependency closure
        # Frozen before pip-audit is installed, so the audited set is what an
        # install of industrialstats actually pulls in. --exclude-editable
        # drops this package itself; pip omits itself from freeze, and
        # setuptools/wheel are build tooling that never reaches users.
        run: |
          python -m pip freeze --exclude-editable | grep -vEi '^(setuptools|wheel|pip)==' > audit-requirements.txt
          echo "Auditing $(wc -l < audit-requirements.txt) dependencies"
      - name: Audit dependencies
        # Installed after the freeze so its own dependencies are not audited.
        run: |
          python -m pip install pip-audit
          pip-audit --strict --progress-spinner=off --requirement audit-requirements.txt
