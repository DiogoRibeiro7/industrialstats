name: Documentation diagrams

on:
  push:
    branches:
      - main
    paths:
      - "docs/diagrams/**"
      - ".github/workflows/documentation_diagrams.yml"
  pull_request:
    paths:
      - "docs/diagrams/**"
      - ".github/workflows/documentation_diagrams.yml"

permissions:
  contents: read

jobs:
  render:
    name: Validate documentation diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
          dot -V

      - name: Validate diagram sources and committed renders
        run: |
          set -euo pipefail
          mkdir -p /tmp/industrialstats-diagrams

          for source in docs/diagrams/*.dot; do
            name="$(basename "${source}" .dot)"
            rendered="docs/diagrams/rendered/${name}.svg"
            test -f "${rendered}"

            dot -Tsvg "${source}" -o "/tmp/industrialstats-diagrams/${name}.svg"

            source_hash="$(sha256sum "${source}" | awk '{print $1}')"
            if grep -q "Source-SHA256:" "${rendered}"; then
              grep -q "Source-SHA256: ${source_hash}" "${rendered}"
            else
              diff \
                <(sed '/Generated by graphviz version/d' "/tmp/industrialstats-diagrams/${name}.svg") \
                <(sed '/Generated by graphviz version/d' "${rendered}")
            fi
          done
