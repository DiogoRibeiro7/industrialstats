name: Performance

on:
  schedule:
    # Weekly, so timing regressions surface without blocking pull requests.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: benchmarks (3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest hypothesis
      - name: Run performance benchmarks
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest -m benchmark
