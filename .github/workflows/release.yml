name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without the leading v, for example 0.3.1"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/industrialstats/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          else
            if [[ -z "$INPUT_VERSION" ]]; then
              echo "A version is required for a manual release"
              exit 1
            fi
            if [[ "$INPUT_VERSION" == v* ]]; then
              echo "Enter the version without the leading v"
              exit 1
            fi
            tag="v$INPUT_VERSION"
          fi

          if [[ "$tag" != v* ]]; then
            echo "Release tag $tag must start with v"
            exit 1
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify release commit is on main
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          release_commit="$(git rev-parse HEAD)"
          main_commit="$(git rev-parse origin/main)"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$release_commit" != "$main_commit" ]]; then
            echo "Manual releases must use the current main commit"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release commit is not contained in main"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag {tag!r} must start with 'v'")
          expected = tag[1:]

          pyproject_version = tomllib.loads(
              Path("pyproject.toml").read_text()
          )["tool"]["poetry"]["version"]

          init_text = Path("src/industrialstats/__init__.py").read_text()
          init_match = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']',
              init_text,
              re.MULTILINE,
          )
          if init_match is None:
              raise SystemExit("Could not read __version__ from package __init__.py")
          runtime_version = init_match.group(1)

          citation_text = Path("CITATION.cff").read_text()
          citation_match = re.search(
              r'^version:\s*["\']?([^"\'\s]+)["\']?\s*$',
              citation_text,
              re.MULTILINE,
          )
          if citation_match is None:
              raise SystemExit("Could not read version from CITATION.cff")
          citation_version = citation_match.group(1)

          versions = {
              "pyproject.toml": pyproject_version,
              "src/industrialstats/__init__.py": runtime_version,
              "CITATION.cff": citation_version,
          }
          mismatches = {
              source: version
              for source, version in versions.items()
              if version != expected
          }
          if mismatches:
              raise SystemExit(
                  f"Release tag {tag!r} expects version {expected!r}, "
                  f"but found mismatches: {mismatches}"
              )

          changelog = Path("CHANGELOG.md").read_text()
          release_heading = re.compile(
              rf"^## \[{re.escape(expected)}\] - \d{{4}}-\d{{2}}-\d{{2}}$",
              re.MULTILINE,
          )
          if release_heading.search(changelog) is None:
              raise SystemExit(
                  f"CHANGELOG.md has no dated section for version {expected!r}"
              )
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Create or verify GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          target_commit="$(git rev-parse HEAD)"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" || true
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
            if [[ "$tag_commit" != "$target_commit" ]]; then
              echo "Existing release $RELEASE_TAG does not point to the current main commit"
              exit 1
            fi
            echo "Reusing existing release $RELEASE_TAG"
          elif git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tag_commit" != "$target_commit" ]]; then
              echo "Existing tag $RELEASE_TAG does not point to the current main commit"
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --target "$target_commit" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --latest
          fi

      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
