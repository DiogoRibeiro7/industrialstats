version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      # The scientific stack moves together; reviewing one PR against the whole
      # set is more informative than seven separate bumps.
      scientific-python:
        patterns:
          - "numpy"
          - "pandas"
          - "scipy"
          - "statsmodels"
          - "scikit-learn"
          - "matplotlib"
          - "seaborn"
          - "plotly"
      dev-tooling:
        dependency-type: "development"

  # pre-commit hook revisions. Without this, the pins in
  # .pre-commit-config.yaml go stale silently and drift from the equivalent
  # constraints in pyproject.toml, so CI's linter and a contributor's local
  # linter can be different versions.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "pre-commit"
    groups:
      pre-commit:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
