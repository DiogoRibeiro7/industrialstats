repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # mypy runs from your own environment rather than an isolated hook env.
  # Resolving this package's types needs the real scientific stack installed;
  # a hook env with a partial dependency set silently reports different errors
  # than CI does. Install the dev dependencies and this hook matches the CI
  # `type check` job exactly.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        # `files` in pyproject.toml already scopes the run to the package.
        pass_filenames: false
        require_serial: true
