<?xml version="1.0" encoding="UTF-8"?>
<!-- Source-SHA256: 09b5b9bbc019e753ed25b7b2228561386e926f64c3022d21b70d5fd47b7007fe -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">industrialstats fractional aliasing and factorial blocking</title>
  <desc id="desc">A comparison of fractional-factorial aliasing and full-factorial treatment blocking, with canonical examples.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <style>
      .box{fill:#fff;stroke:#222;stroke-width:1.5;rx:8;ry:8}.cluster{fill:none;stroke:#222;stroke-width:1.5;rx:12;ry:12}.t{font:15px Helvetica,Arial,sans-serif;fill:#111}.h{font:bold 19px Helvetica,Arial,sans-serif;fill:#111}.title{font:bold 25px Helvetica,Arial,sans-serif;fill:#111}.line{stroke:#222;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dash{stroke:#222;stroke-width:1.4;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>
  <text x="800" y="38" text-anchor="middle" class="title">industrialstats: fractional aliasing and factorial blocking</text>

  <rect x="45" y="390" width="250" height="95" class="box"/>
  <text x="170" y="420" text-anchor="middle" class="t"><tspan x="170" font-weight="bold">Two-level factorial space</tspan><tspan x="170" dy="22">Factors coded −1 / +1</tspan><tspan x="170" dy="22">Effects are treatment words</tspan></text>

  <rect x="350" y="80" width="1190" height="330" class="cluster"/>
  <text x="945" y="112" text-anchor="middle" class="h">Fractional factorial · fewer treatment combinations</text>
  <g class="t" text-anchor="middle">
    <rect x="390" y="155" width="175" height="70" class="box"/><text x="478" y="183"><tspan x="478" font-weight="bold">Choose fraction</tspan><tspan x="478" dy="21">1/2 · 1/4 · 1/8 · 1/16</tspan></text>
    <rect x="610" y="145" width="210" height="90" class="box"/><text x="715" y="174"><tspan x="715" font-weight="bold">Generators</tspan><tspan x="715" dy="21">Derived factors = products</tspan><tspan x="715" dy="21">of base factors</tspan></text>
    <rect x="865" y="145" width="205" height="90" class="box"/><text x="968" y="174"><tspan x="968" font-weight="bold">Defining relation</tspan><tspan x="968" dy="21">Identity + generated</tspan><tspan x="968" dy="21">treatment words</tspan></text>
    <rect x="1115" y="145" width="195" height="90" class="box"/><text x="1212" y="174"><tspan x="1212" font-weight="bold">Alias structure</tspan><tspan x="1212" dy="21">Multiply effects by</tspan><tspan x="1212" dy="21">the defining relation</tspan></text>
    <rect x="1355" y="145" width="155" height="90" class="box"/><text x="1432" y="174"><tspan x="1432" font-weight="bold">Resolution</tspan><tspan x="1432" dy="21">Shortest defining</tspan><tspan x="1432" dy="21">word controls severity</tspan></text>
  </g>
  <path d="M565 190 H610" class="line"/><path d="M820 190 H865" class="line"/><path d="M1070 190 H1115" class="line"/><path d="M1310 190 H1355" class="line"/>
  <rect x="660" y="275" width="430" height="86" class="box"/>
  <text x="875" y="302" text-anchor="middle" class="t"><tspan x="875" font-weight="bold">Example: 2^(4−1) half fraction</tspan><tspan x="875" dy="21">D = A·B·C ⇒ I = A·B·C·D ⇒ Resolution IV</tspan><tspan x="875" dy="21">A ≡ B·C·D,  AB ≡ C·D</tspan></text>
  <rect x="1170" y="275" width="300" height="86" class="box"/>
  <text x="1320" y="302" text-anchor="middle" class="t"><tspan x="1320" font-weight="bold">Foldover / augmentation</tspan><tspan x="1320" dy="21">Add runs when an important</tspan><tspan x="1320" dy="21">alias must be broken</tspan></text>
  <path d="M1212 235 V275 H1090" class="dash"/><path d="M1090 318 H1170" class="line"/>

  <rect x="350" y="455" width="1190" height="315" class="cluster"/>
  <text x="945" y="487" text-anchor="middle" class="h">Full factorial blocking · same treatments, restricted groups</text>
  <g class="t" text-anchor="middle">
    <rect x="390" y="530" width="175" height="70" class="box"/><text x="478" y="558"><tspan x="478" font-weight="bold">Choose 2^p blocks</tspan><tspan x="478" dy="21">Full 2^k treatment set</tspan></text>
    <rect x="610" y="520" width="210" height="90" class="box"/><text x="715" y="549"><tspan x="715" font-weight="bold">Block generators</tspan><tspan x="715" dy="21">p independent treatment</tspan><tspan x="715" dy="21">words over GF(2)</tspan></text>
    <rect x="865" y="520" width="205" height="90" class="box"/><text x="968" y="549"><tspan x="968" font-weight="bold">Defining subgroup</tspan><tspan x="968" dy="21">All non-identity products</tspan><tspan x="968" dy="21">of block generators</tspan></text>
    <rect x="1115" y="520" width="195" height="90" class="box"/><text x="1212" y="549"><tspan x="1212" font-weight="bold">Block membership</tspan><tspan x="1212" dy="21">From treatment contrasts</tspan><tspan x="1212" dy="21">not row position</tspan></text>
    <rect x="1355" y="520" width="155" height="90" class="box"/><text x="1432" y="549"><tspan x="1432" font-weight="bold">Confounding</tspan><tspan x="1432" dy="21">Subgroup effects are</tspan><tspan x="1432" dy="21">sacrificed to blocks</tspan></text>
  </g>
  <path d="M565 565 H610" class="line"/><path d="M820 565 H865" class="line"/><path d="M1070 565 H1115" class="line"/><path d="M1310 565 H1355" class="line"/>
  <rect x="650" y="650" width="490" height="78" class="box"/>
  <text x="895" y="678" text-anchor="middle" class="t"><tspan x="895" font-weight="bold">Example: 2^3 full factorial in 2 blocks</tspan><tspan x="895" dy="21">Generator A·B·C ⇒ ABC confounded with block;</tspan><tspan x="895" dy="21">main effects and 2-factor interactions remain clear</tspan></text>
  <rect x="1190" y="650" width="280" height="78" class="box"/>
  <text x="1330" y="678" text-anchor="middle" class="t"><tspan x="1330" font-weight="bold">Restricted randomization</tspan><tspan x="1330" dy="21">Randomize within blocks</tspan><tspan x="1330" dy="21">to preserve the design</tspan></text>
  <path d="M1432 610 V630 H1140 V689 H1190" class="line"/>

  <path d="M295 437 H330 V190 H390" class="line"/>
  <path d="M295 437 H330 V565 H390" class="line"/>

  <rect x="355" y="805" width="1180" height="65" class="box"/>
  <text x="945" y="832" text-anchor="middle" class="t"><tspan x="945" font-weight="bold">Interpretation boundary</tspan><tspan x="945" dy="22">Fractionation creates treatment-effect aliasing. Blocking creates treatment–block confounding. Related GF(2) algebra, different experimental problems.</tspan></text>
</svg>
