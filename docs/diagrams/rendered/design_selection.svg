  <path d="M1040 832 H1130 V536 H1190" class="line"/>
  <path d="M1040 937 H1105 V655 H1190" class="line"/><path d="M1040 937 H1120 V770 H1190" class="line"/><path d="M1040 937 H1130 V885 H1190" class="line"/>
  <path d="M1040 1042 H1110 V998 H1190" class="line"/><path d="M1040 1042 H1130 V885 H1190" class="line"/>
  <path d="M1050 1150 H1120 V1115 H1190" class="line"/><path d="M1050 1150 H1130 V1230 H1190" class="line"/>
  <path d="M1060 1258 H1130 V1345 H1190" class="line"/>
</svg>
