<?xml version="1.0" encoding="UTF-8"?>
<!-- Source-SHA256: 1129e2ae03a125aa891c1b1cc4787b9931a243ea4d56e4fdc0fabf42920ef810 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1415" viewBox="0 0 1560 1415" role="img" aria-labelledby="title desc">
  <title id="title">industrialstats design-family selection map</title>
  <desc id="desc">A three-stage decision map from structural experimental constraints to statistical goals and appropriate industrialstats design families.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <style>
      .box{fill:#fff;stroke:#222;stroke-width:1.5;rx:8;ry:8}.cluster{fill:none;stroke:#222;stroke-width:1.5;rx:12;ry:12}.t{font:16px Helvetica,Arial,sans-serif;fill:#111}.h{font:bold 20px Helvetica,Arial,sans-serif;fill:#111}.title{font:bold 26px Helvetica,Arial,sans-serif;fill:#111}.line{stroke:#222;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="780" y="38" text-anchor="middle" class="title">industrialstats: design-family selection map</text>

  <rect x="45" y="640" width="280" height="92" class="box"/>
  <text x="185" y="670" text-anchor="middle" class="t"><tspan x="185" font-weight="bold">Start</tspan><tspan x="185" dy="22">Define response, factors, run budget</tspan><tspan x="185" dy="22">and experimental-unit constraints</tspan></text>

  <rect x="370" y="95" width="360" height="820" class="cluster"/>
  <text x="550" y="128" text-anchor="middle" class="h">1 · Structural constraints first</text>
  <rect x="415" y="180" width="270" height="78" class="box"/><text x="550" y="210" text-anchor="middle" class="t"><tspan x="550">Components must sum to a total</tspan><tspan x="550" dy="22">→ formulation / blend experiment</tspan></text>
  <rect x="415" y="350" width="270" height="78" class="box"/><text x="550" y="380" text-anchor="middle" class="t"><tspan x="550">Some factors are hard to change</tspan><tspan x="550" dy="22">→ restricted randomization</tspan></text>
  <rect x="415" y="520" width="270" height="78" class="box"/><text x="550" y="550" text-anchor="middle" class="t"><tspan x="550">Known nuisance source</tspan><tspan x="550" dy="22">→ batch / day / operator</tspan></text>
  <rect x="400" y="705" width="300" height="78" class="box"/><text x="550" y="735" text-anchor="middle" class="t"><tspan x="550">No dominant structural constraint</tspan><tspan x="550" dy="22">→ choose by statistical goal</tspan></text>

  <rect x="780" y="725" width="305" height="645" class="cluster"/>
  <text x="932" y="758" text-anchor="middle" class="h">2 · Statistical goal</text>
  <rect x="825" y="800" width="215" height="64" class="box"/><text x="932" y="827" text-anchor="middle" class="t"><tspan x="932">Compare treatments</tspan><tspan x="932" dy="21">Homogeneous units</tspan></text>
  <rect x="825" y="905" width="215" height="64" class="box"/><text x="932" y="932" text-anchor="middle" class="t"><tspan x="932">Screen many factors</tspan><tspan x="932" dy="21">Small run budget</tspan></text>
  <rect x="825" y="1010" width="215" height="64" class="box"/><text x="932" y="1037" text-anchor="middle" class="t"><tspan x="932">Estimate interactions</tspan><tspan x="932" dy="21">Control aliasing</tspan></text>
  <rect x="815" y="1115" width="235" height="70" class="box"/><text x="932" y="1143" text-anchor="middle" class="t"><tspan x="932">Model curvature / optimize</tspan><tspan x="932" dy="21">Few important factors</tspan></text>
  <rect x="805" y="1220" width="255" height="76" class="box"/><text x="932" y="1248" text-anchor="middle" class="t"><tspan x="932">Irregular candidate region</tspan><tspan x="932" dy="21">or fixed candidate set / run count</tspan></text>

  <rect x="1130" y="70" width="385" height="1300" class="cluster"/>
  <text x="1322" y="103" text-anchor="middle" class="h">3 · industrialstats design family</text>
  <g class="t" text-anchor="middle">
    <rect x="1190" y="150" width="265" height="86" class="box"/><text x="1322" y="179"><tspan x="1322" font-weight="bold">Mixture</tspan><tspan x="1322" dy="21">Simplex-lattice available</tspan><tspan x="1322" dy="21">Use mixture-specific models</tspan></text>
    <rect x="1190" y="265" width="265" height="86" class="box"/><text x="1322" y="294"><tspan x="1322" font-weight="bold">Split-plot</tspan><tspan x="1322" dy="21">Whole-plot + subplot units</tspan><tspan x="1322" dy="21">Analysis must respect both strata</tspan></text>
    <rect x="1190" y="380" width="265" height="86" class="box"/><text x="1322" y="409"><tspan x="1322" font-weight="bold">RCBD</tspan><tspan x="1322" dy="21">Block the nuisance source</tspan><tspan x="1322" dy="21">Randomize within blocks</tspan></text>
    <rect x="1190" y="495" width="265" height="82" class="box"/><text x="1322" y="526"><tspan x="1322" font-weight="bold">CRD</tspan><tspan x="1322" dy="21">Completely randomized</tspan><tspan x="1322" dy="21">treatment comparison</tspan></text>
    <rect x="1190" y="610" width="265" height="90" class="box"/><text x="1322" y="639"><tspan x="1322" font-weight="bold">Definitive screening</tspan><tspan x="1322" dy="21">Three-level quantitative screening</tspan><tspan x="1322" dy="21">Main effects + curvature information</tspan></text>
    <rect x="1190" y="725" width="265" height="90" class="box"/><text x="1322" y="754"><tspan x="1322" font-weight="bold">Plackett-Burman</tspan><tspan x="1322" dy="21">Economical main-effect screening</tspan><tspan x="1322" dy="21">Interpret interactions cautiously</tspan></text>
    <rect x="1190" y="840" width="265" height="90" class="box"/><text x="1322" y="869"><tspan x="1322" font-weight="bold">Regular fractional factorial</tspan><tspan x="1322" dy="21">Trade runs for aliasing</tspan><tspan x="1322" dy="21">Inspect resolution / alias structure</tspan></text>
    <rect x="1190" y="955" width="265" height="86" class="box"/><text x="1322" y="984"><tspan x="1322" font-weight="bold">Full factorial</tspan><tspan x="1322" dy="21">All treatment combinations</tspan><tspan x="1322" dy="21">Direct interaction estimation</tspan></text>
    <rect x="1190" y="1070" width="265" height="90" class="box"/><text x="1322" y="1099"><tspan x="1322" font-weight="bold">Central composite</tspan><tspan x="1322" dy="21">Quadratic model + axial points</tspan><tspan x="1322" dy="21">Sequential augmentation friendly</tspan></text>
    <rect x="1190" y="1185" width="265" height="90" class="box"/><text x="1322" y="1214"><tspan x="1322" font-weight="bold">Box-Behnken</tspan><tspan x="1322" dy="21">Quadratic model without corners</tspan><tspan x="1322" dy="21">Avoids extreme combinations</tspan></text>
    <rect x="1190" y="1300" width="265" height="90" class="box"/><text x="1322" y="1329"><tspan x="1322" font-weight="bold">Optimal design</tspan><tspan x="1322" dy="21">D / A / G / I criteria</tspan><tspan x="1322" dy="21">Candidate-set and run-budget driven</tspan></text>
  </g>

  <path d="M325 686 H370" class="line"/><path d="M325 686 V219 H415" class="line"/><path d="M325 686 V389 H415" class="line"/><path d="M325 686 V559 H415" class="line"/><path d="M325 686 V744 H400" class="line"/>
  <path d="M685 219 H1130 V193 H1190" class="line"/><path d="M685 389 H1130 V308 H1190" class="line"/><path d="M685 559 H1130 V423 H1190" class="line"/>
