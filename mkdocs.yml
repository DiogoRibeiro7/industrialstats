site_name: industrialstats
site_description: Industrial statistics and design of experiments for Python
site_url: https://diogoribeiro7.github.io/industrialstats/
repo_url: https://github.com/DiogoRibeiro7/industrialstats
repo_name: DiogoRibeiro7/industrialstats
edit_uri: edit/main/docs/
copyright: Licensed under the MIT License

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Choosing a design: guides/choosing-a-design.md
      - Command-line interface: guides/cli.md
  - API reference:
      - Designs: reference/designs.md
      - Analysis: reference/analysis.md
      - Utilities: reference/utils.md
      - Visualization: reference/visualizations.md
  - Project:
      - Contributing: contributing.md
      - Roadmap: roadmap.md
      - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DiogoRibeiro7/industrialstats
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/industrialstats/

watch:
  - src/industrialstats
